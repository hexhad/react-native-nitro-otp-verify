version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: 'gradle'
    directories:
      - '/android/'
      - '/example/android/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'bundler'
    directory: '/example/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: 'npm'
    directories:
      - '/example/'
      - '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react-native-cli:
        patterns:
          - '@react-native-community/cli*'
      babel:
        patterns:
          - '@babel/*'
      react-native:
        patterns:
          - 'react-native'
          - '@react-native/*'
      nitro:
        patterns:
          - 'nitrogen'
          - 'react-native-nitro-modules'
